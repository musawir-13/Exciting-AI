name: Exciting AI - Multi-Platform Release Builder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            cmd: npm run pack:win && npm run pack:win:portable
          - os: macos-latest
            platform: macos
            cmd: npm run pack:mac
          - os: ubuntu-latest
            platform: linux
            cmd: npm run pack:linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools libsecret-1-dev

      - name: Install Dependencies
        run: npm install

      - name: Build Application Packages
        run: ${{ matrix.cmd }}

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd release
          for f in *.{exe,dmg,zip,AppImage,deb,rpm}; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mobile-and-web:
    name: Build Android APK and Web Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Package Standalone Web Edition
        run: |
          npm run build:web
          cd dist
          tar -czf Exciting-AI-Web-Standalone.tar.gz web/
          sha256sum Exciting-AI-Web-Standalone.tar.gz > Exciting-AI-Web-Standalone.tar.gz.sha256

      - name: Build Android Project
        run: |
          npm run build:android
          cd release/android
          zip -r Exciting-AI-Android-Project.zip .
          sha256sum Exciting-AI-Android-Project.zip > Exciting-AI-Android-Project.zip.sha256

      - name: Upload Mobile & Web Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Exciting-AI-Web-Standalone.tar.gz*
            release/android/Exciting-AI-Android-Project.zip*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
