<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="radial-blue" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radial-cyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="1280" height="420" rx="16" fill="url(#grid)" />
  <rect width="1280" height="420" rx="16" fill="url(#radial-blue)" />
  <rect width="1280" height="420" rx="16" fill="url(#radial-cyan)" />

  <!-- Top Border Accent Glow -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#glow-grad)" />

  <!-- Subtitle Tag / Pill -->
  <g transform="translate(80, 70)">
    <rect width="490" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="16" r="5" fill="#10b981" />
    <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">1,927 FRONTIER MODELS · SHARED WEB RESEARCH ENGINE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="175" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    EXCITING AI <tspan fill="#38bdf8">⚡</tspan>
  </text>

  <!-- Core Tagline -->
  <text x="82" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    Autonomous, local-first multi-platform desktop workspace and intelligent research companion.
  </text>
  <text x="82" y="255" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
    Zero vendor lock-in · Universal model catalogue · Real-time web retrieval · Local session persistence
  </text>

  <!-- Feature Pills / Technology Badges -->
  <g transform="translate(80, 295)">
    <!-- Pill 1: Platform -->
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🖥️ Windows · macOS · Linux</text>

    <!-- Pill 2: Web Research -->
    <rect x="235" y="0" width="210" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="251" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🌐 Real-Time Web Access</text>

    <!-- Pill 3: Privacy -->
    <rect x="460" y="0" width="180" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="476" y="26" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🔒 100% Local Storage</text>

    <!-- Pill 4: Free Tier -->
    <rect x="655" y="0" width="180" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="671" y="26" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Zero-Key Free Tier</text>
  </g>

  <!-- Right Decorative Geometric Badge / Emblem -->
  <g transform="translate(1000, 90)">
    <rect x="0" y="0" width="200" height="230" rx="16" fill="#0b1329" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="100" cy="80" r="50" fill="#1e293b" stroke="url(#glow-grad)" stroke-width="2.5" />
    <path d="M 96 55 L 86 85 L 100 85 L 94 105 L 114 75 L 102 75 Z" fill="#38bdf8" />
    <text x="100" y="155" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">EXCITING AI</text>
    <text x="100" y="175" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">v1.0.0 RELEASE</text>
    <text x="100" y="200" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Engineered by IDeV</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="417" width="1280" height="3" fill="#1e293b" />
</svg>